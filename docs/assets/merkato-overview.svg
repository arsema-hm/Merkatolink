<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MerkatoLink project overview</title>
  <desc id="desc">A warm editorial illustration of the MerkatoLink marketplace with terra categories, a fictional trader, sample wholesale products and an order summary.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf8f2"/><stop offset="1" stop-color="#eee9dc"/></linearGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#657755"/><stop offset="1" stop-color="#394c37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#283124" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1125" cy="24" r="210" fill="#e4d6b7" opacity=".35"/>
  <circle cx="54" cy="600" r="190" fill="#d7dfcf" opacity=".48"/>
  <g font-family="Arial, sans-serif">
    <rect x="54" y="44" width="42" height="42" rx="21" fill="none" stroke="#526747" stroke-width="1.5"/>
    <text x="75" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic" fill="#526747">M</text>
    <text x="110" y="66" font-size="19" font-weight="700" letter-spacing="-.5" fill="#292d25">MerkatoLink</text>
    <text x="110" y="83" font-size="8" letter-spacing="2.1" fill="#898779">DIGITAL MERKATO</text>
    <text x="54" y="178" font-size="10" font-weight="700" letter-spacing="2.6" fill="#9c674a">A WHOLESALE MARKETPLACE FOR ETHIOPIA</text>
    <text x="50" y="249" font-family="Georgia,serif" font-size="62" fill="#292d25">Find your place</text>
    <text x="50" y="315" font-family="Georgia,serif" font-size="62" font-style="italic" fill="#526747">in the market.</text>
    <text x="54" y="358" font-size="15" fill="#66685e">Explore Addis Ababa’s wholesale traders by terra.</text>
    <text x="54" y="382" font-size="15" fill="#66685e">Compare goods, choose delivery and send a clear order.</text>
    <rect x="54" y="421" width="213" height="48" rx="3" fill="url(#olive)"/>
    <text x="76" y="451" font-size="13" font-weight="700" fill="#fff">Explore the marketplace</text>
    <path d="M239 445h12m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="54" y="526" font-size="10" letter-spacing="1.2" fill="#858477">FICTIONAL LOCAL DEMO · ETB PRICING</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="92" width="492" height="444" rx="8" fill="#fffefa" stroke="#dfdacd"/>
    <rect x="650" y="92" width="492" height="50" rx="8" fill="#fffefa"/>
    <path d="M650 142h492" stroke="#e5e0d5"/>
    <circle cx="679" cy="117" r="12" fill="#526747"/>
    <text x="679" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#fff">M</text>
    <text x="700" y="121" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#30342d">MerkatoLink <tspan font-size="9" font-weight="400" fill="#77786e">market preview</tspan></text>
    <text x="1055" y="121" font-family="Arial,sans-serif" font-size="9" fill="#77786e">Addis Ababa</text>
    <text x="678" y="171" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#9c674a">SHOP BY TERRA</text>
    <g font-family="Arial,sans-serif" font-size="10" text-anchor="middle">
      <rect x="678" y="184" width="93" height="38" rx="3" fill="#eeece4"/><text x="724" y="208" fill="#33382f">Kimem</text>
      <rect x="780" y="184" width="93" height="38" rx="3" fill="#e9e0d5"/><text x="826" y="208" fill="#33382f">Minalesh</text>
      <rect x="882" y="184" width="93" height="38" rx="3" fill="#e5e9df"/><text x="928" y="208" fill="#33382f">Shema</text>
      <rect x="984" y="184" width="128" height="38" rx="3" fill="#eee3da"/><text x="1048" y="208" fill="#33382f">Somali · Termus</text>
    </g>
    <text x="678" y="259" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#9c674a">WHOLESALE LISTINGS</text>
    <g>
      <rect x="678" y="276" width="133" height="142" rx="4" fill="#f0eadc"/><text x="744" y="350" text-anchor="middle" font-size="43">🌶️</text><text x="690" y="383" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#30342d">Berbere Spice Sack</text><text x="690" y="402" font-family="Arial,sans-serif" font-size="9" fill="#77786e">ETB 4,600 · sack of 50</text>
      <rect x="823" y="276" width="133" height="142" rx="4" fill="#e6ecdf"/><text x="889" y="350" text-anchor="middle" font-size="43">🌾</text><text x="835" y="383" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#30342d">Red Lentils</text><text x="835" y="402" font-family="Arial,sans-serif" font-size="9" fill="#77786e">ETB 6,100 · quintal</text>
      <rect x="968" y="276" width="144" height="142" rx="4" fill="#eee1d8"/><g transform="translate(1040 340)" fill="none" stroke="#697754" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-25h24v8l-4 7v34h-16v-34l-4-7z"/><path d="M-8-29v-5h16v5M-11 4h22"/></g><text x="980" y="383" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#30342d">Household goods</text><text x="980" y="402" font-family="Arial,sans-serif" font-size="9" fill="#77786e">Fictional demo catalog</text>
    </g>
    <rect x="678" y="440" width="434" height="68" rx="4" fill="#f5f3ed"/>
    <text x="695" y="466" font-family="Arial,sans-serif" font-size="9" letter-spacing=".8" fill="#77786e">DEMO ORDER SUMMARY</text>
    <text x="695" y="490" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#30342d">Cart · delivery · payment preference</text>
    <rect x="1001" y="456" width="94" height="35" rx="3" fill="#526747"/><text x="1048" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">Review order</text>
  </g>
  <text x="1142" y="602" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#858477">Concept artwork · generated from fictional demo content</text>
